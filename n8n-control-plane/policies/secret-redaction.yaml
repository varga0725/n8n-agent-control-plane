# Secret-redaction policy. Mirrors src/n8n_cp/core/redaction.py.
# Applied recursively (objects + arrays) to all tool output, audit records and
# error details before anything leaves the process.
version: 1

mask: "[REDACTED]"
recursive: true
case_insensitive: true
match: substring_on_key

redact_keys:
  - password
  - passphrase
  - apiKey
  - api_key
  - token
  - accessToken
  - refreshToken
  - secret
  - clientSecret
  - privateKey
  - authorization
  - cookie
  - session
  - webhookSecret
  - credentials        # n8n credential `data` blobs

allowlist:
  # Surfaced deliberately — not credentials.
  - confirmationToken  # short-lived, operation-bound approval handle

never_persist:
  - api_key            # the X-N8N-API-KEY value never appears in logs/audit/errors
  - raw_credential_data
  - raw_personal_execution_data   # when N8N_REDACT_EXECUTION_DATA=true
